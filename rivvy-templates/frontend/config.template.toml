# Settings related to how the application runs
[application]
  # Specifies how the application will run
  # Has a value of either "development" or "production". Defaults to "development"
  environment = "development"

  # Domain used by the application
  # Has an IP address string type or domain string type. Must include the protocol (http or https). Required
  # TEMPLATE: Update to match the port your app runs on (set in package.json dev script)
  domain = "http://localhost:3000"

  # Settings related to the backend server this app proxies requests to
  [application.server]

    # Base URL of the backend service — all /api/* requests are forwarded here
    # Has a string type. Required
    # TEMPLATE: Update to the backend service URL this app talks to
    base-url = "http://localhost:8001"

    [application.server.testing]

      # Base URL for the testing backend server
      # Has a string type. Required
      base-url = "http://localhost:3003/api/v1"
